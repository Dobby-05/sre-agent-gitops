apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-agent
  template:
    metadata:
      labels:
        app: sre-agent
    spec:
      serviceAccountName: sre-agent-sa
      containers:
      - name: agent
        image: sre-agent:v1.0
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: "/app/data"
          name: agent-data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: agent-data
        persistentVolumeClaim:
          claimName: sre-agent-claim
